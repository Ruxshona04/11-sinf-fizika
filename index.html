<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>11-sinf Fizika — simulyatsiya, video va testlar</title>
<style>
:root{--bg:#f8fafc;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--pri:#2563eb;--b1:#dbeafe;--b2:#fef3c7;--b3:#dcfce7;--life:#ecfdf5}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
#top{position:sticky;top:0;z-index:20;background:#1e3a8a;color:#fff;display:flex;align-items:center;gap:12px;padding:8px 14px}
#top b{font-size:16px}#menu{background:#2563eb;border:0;color:#fff;border-radius:8px;font-size:18px;padding:4px 10px;cursor:pointer}
#pb{flex:1;height:8px;background:#1e40af;border-radius:6px;overflow:hidden;max-width:300px}#pb i{display:block;height:100%;width:0;background:#4ade80;transition:width .4s}#pt{font-size:12px;opacity:.9}
#side{position:fixed;top:48px;bottom:0;left:0;width:310px;overflow:auto;background:#fff;border-right:1px solid var(--line);padding:10px;z-index:15;transform:translateX(-100%);transition:transform .25s}
#side.open{transform:none}#side h4{margin:14px 4px 4px;font-size:11px;color:var(--mut);letter-spacing:.04em}
#side a{display:block;padding:6px 10px;border-radius:8px;font-size:13px;color:var(--ink);cursor:pointer;text-decoration:none}#side a:hover{background:#eff6ff}#side a.on{background:var(--pri);color:#fff}#side a.dn::after{content:' ✓';color:#16a34a;font-weight:700}
main{max-width:860px;margin:0 auto;padding:16px}
@media(min-width:1100px){#side{transform:none}main{margin-left:330px;margin-right:auto}#menu{display:none}}
.hero{background:linear-gradient(135deg,#1d4ed8,#7c3aed);color:#fff;border-radius:16px;padding:22px}.hero h1{margin:0 0 6px;font-size:24px}.hero p{margin:4px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin:8px 0 18px}.grid button{text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;font-size:13px}.grid button:hover{border-color:var(--pri)}
h2.g{font-size:13px;color:var(--mut);margin:18px 0 4px}
.lh{margin:4px 0 12px}.lh small{color:var(--mut)}.lh h1{margin:2px 0;font-size:24px}
table.bsb{width:100%;border-collapse:collapse;table-layout:fixed;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.bsb th{padding:8px;font-size:14px}.bsb th.c1{background:var(--b1)}.bsb th.c2{background:var(--b2)}.bsb th.c3{background:var(--b3)}.bsb td{padding:6px;vertical-align:top;border:1px solid var(--line)}
.bsb textarea{width:100%;min-height:90px;border:0;resize:vertical;font:inherit;font-size:13px;background:transparent}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:16px 0;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.card h3{margin:0 0 6px;font-size:17px}.rj{display:inline-block;background:var(--pri);color:#fff;border-radius:8px;padding:1px 9px;font-size:12px;margin-right:6px}
.life{background:var(--life);border-left:4px solid #10b981;border-radius:8px;padding:8px 12px;margin:10px 0;font-size:14px}
.sim{margin-top:10px;border:1px solid var(--line);border-radius:12px;overflow:hidden}.sim canvas{display:block;width:100%;height:auto;background:#fff}
.ctl{padding:8px 12px;background:#f8fafc;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:6px 16px}.ctl label{font-size:12px;color:#334155;display:block}.ctl input{width:100%}.ctl output{font-weight:700;color:var(--pri)}
.btns{display:flex;gap:8px;padding:6px 12px;background:#f8fafc}.btns button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 12px;cursor:pointer;font-size:13px}
.ro{padding:8px 12px;font-size:13px;background:#eff6ff;border-top:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;font-size:13px}.chips span{color:var(--mut)}.chips button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:3px 12px;cursor:pointer;font-size:13px}
.chips button.on.b{background:var(--b1);border-color:#60a5fa}.chips button.on.s{background:var(--b2);border-color:#f59e0b}.chips button.on.k{background:var(--b3);border-color:#22c55e}
.pause{background:#fffbeb;border:1px dashed #f59e0b;border-radius:12px;padding:10px 14px;margin:14px 0;font-size:14px}.pause input{width:100%;margin-top:6px;padding:6px;border:1px solid var(--line);border-radius:8px;font:inherit}
.quiz button{display:block;width:100%;text-align:left;margin:6px 0;padding:8px 12px;border:1px solid var(--line);background:#fff;border-radius:10px;cursor:pointer;font-size:14px}.quiz button.ok{background:#dcfce7;border-color:#22c55e}.quiz button.no{background:#fee2e2;border-color:#ef4444}
.nav{display:flex;justify-content:space-between;gap:10px;margin:20px 0 60px}.nav button{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;font-size:14px}.nav button.g{background:#64748b}
@media(max-width:600px){.bsb th{font-size:12px}.bsb textarea{font-size:12px;min-height:110px}}
.t3{height:360px;background:#e0f2fe;position:relative;touch-action:none;cursor:grab}.t3:active{cursor:grabbing}.t3 canvas{width:100%!important;height:100%!important;display:block}
.hint{font-size:12px;color:var(--mut);margin:0 0 8px}
.jump{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}.jump button{border:1px solid var(--line);background:#fff;border-radius:18px;padding:5px 14px;cursor:pointer;font-size:13px}.jump button:hover{border-color:var(--pri)}
.vid{border-radius:12px;overflow:hidden;background:#0f172a;border:1px solid #1e293b}.vid canvas{display:block;width:100%;height:auto;background:#fff}
.cap{padding:10px 14px;color:#f1f5f9;font-size:14px;min-height:84px;line-height:1.55}.cap b{color:#fde047}
.vb{display:flex;gap:6px;align-items:center;padding:6px 10px;background:#1e293b;flex-wrap:wrap}.vb button{border:0;background:#334155;color:#fff;border-radius:8px;padding:5px 12px;cursor:pointer;font-size:13px}.vb button:hover{background:#475569}.vb input{flex:1;min-width:120px}.vt{color:#cbd5e1;font-size:12px}
.vl{display:block;padding:6px 14px 10px;background:#1e293b;color:#93c5fd;font-size:12px;text-decoration:none}
.tq{margin:10px 0;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff}
.tq button{display:block;width:100%;text-align:left;margin:5px 0;padding:8px 12px;border:1px solid var(--line);background:#fff;border-radius:10px;cursor:pointer;font-size:14px;font:inherit;font-size:14px}
.tq button.sel{background:#dbeafe;border-color:#60a5fa}.tq button.ok{background:#dcfce7;border-color:#22c55e}.tq button.no{background:#fee2e2;border-color:#ef4444}
.tb{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:9px 18px;cursor:pointer;font-size:14px;margin:4px 6px 4px 0}.tb.g{background:#64748b}
.tres{margin-top:8px;padding:10px 14px;background:#fffbeb;border-radius:10px;font-size:15px}.tres:empty{display:none}
#side a.ts{border-left:4px solid #f59e0b}

.ytbox{position:relative;width:100%;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#000}.ytbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.ytcard .vl{display:inline-block;margin-top:8px}

#authBar{max-width:860px;margin:0 auto;padding:0 16px 40px;text-align:center}
@media(min-width:1100px){#authBar{margin-left:330px;margin-right:auto}}
#authBtn{background:linear-gradient(135deg,#1d4ed8,#7c3aed);color:#fff;border:0;border-radius:12px;padding:12px 28px;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 2px 8px rgba(37,99,235,.3)}
#authBtn:hover{filter:brightness(1.08)}
#authBox{display:none;position:fixed;inset:0;z-index:50;background:rgba(15,23,42,.55);align-items:center;justify-content:center;padding:16px}
#authBox.show{display:flex}
#authBox div{background:#fff;border-radius:16px;max-width:460px;width:100%;padding:24px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.3)}
#authBox h3{margin:0 0 12px;font-size:18px;color:#1e3a8a}
#authBox p{margin:0 0 16px;font-size:15px;line-height:1.7}
#authBox img{width:150px;height:150px;border-radius:50%;object-fit:cover;border:4px solid #dbeafe;margin:0 auto 14px;display:block;box-shadow:0 2px 10px rgba(0,0,0,.2)}
#authBox button{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:8px 22px;font-size:14px;cursor:pointer}
</style>
</head>

L(1,"I bob. Magnit maydon","Magnit maydon. Magnit maydonni tavsiflovchi kattaliklar",[["Magnit maydonining fizik mohiyati va uning paydo bo‘lish manbalari (zaryadlarning harakati).", "Magnit maydon — harakatlanayotgan elektr zaryadlari va tokli o‘tkazgichlar atrofida paydo bo‘ladigan, zaryadli zarrachalarga va tokli konturlarga kuch bilan ta’sir qiluvchi alohida ko‘rinishdagi materiyadir. Magnit maydonning asosiy kuch tavsifi — magnit induksiya vektori B hisoblanadi.", "Kompas strelkasi va telefondagi kompas Yerning magnit maydonini sezadi.", "lor", {}], ["Magnit induksiya vektori (B), uning yo‘nalishi va SI sistemasidagi birligi (Tesla - T).", "SI sistemasida uning birligi Tesla (T). B bir jinsli maydonda 1 Tesla deb shunday induksiyaga aytiladiki, unda 1 metr uzunlikdagi 1 Amper tok oqayotgan to‘g‘ri o‘tkazgichga maydon tomonidan maksimal 1 Nyuton Amper kuchi ta’sir qiladi.", "Elektr dvigatel, kir yuvish mashinasi va ventilyatorda tokli ramka magnit maydonda aylanadi.", "lor", {}], ["Magnit induksiya chiziqlari, ularning tutashlik xossasi va o‘ng burg‘u qoidasi.", "Magnit induksiya chiziqlari har doim yopiq chiziqlardan iborat bo‘lib (uyurmaviy maydon), uning manbai yoki cheklovi bo‘lmaydi. Maydon yo‘nalishi o‘ng burg‘u (vint) qoidasi yoki o‘ng qo‘l qoidasi yordamida aniqlanadi.", "Kineskop, siklotron va mass-spektrometrda zaryadli zarralar magnit maydon yordamida boshqariladi.", "lor", {}]],["Induksiyasi 0.4 T bir jinsli magnit maydoniga 5 A tokli 0.5 m o‘tkazgich tik joylashtirilgan. Unga ta’sir etuvchi Amper kuchini toping.", ["1.0 N", "2.0 N", "0.1 N", "0.5 N"], 0]);
L(2,"I bob. Magnit maydon","Bir jinsli magnit maydonning tokli ramkani aylantiruvchi momenti",[["Bir jinsli magnit maydonga joylashtirilgan tokli konturga Amper kuchlarining ta’siri.", "Bir jinsli magnit maydoniga joylashtirilgan S yuzali, I tokli yopiq ramkaga Amper kuchlari jufti ta’sir qiladi. Bu kuchlar ramkani buruvchi M moment hosil qiladi: M = I · S · B · sin(α), bu yerda α — ramka yuzasiga o‘tkazilgan normal vektori n bilan B vektori orasidagi burchak.", "Kompas strelkasi va telefondagi kompas Yerning magnit maydonini sezadi.", "lor", {}], ["Tokli ramkaning magnit momenti (p_m = I * S) va aylantiruvchi kuch momenti (M = p_m * B * sin α).", "Ramkaning o‘z magnit xossasi p_m = I · S (magnit moment) vektori bilan tavsiflanadi. α = 90° bo‘lganda aylantiruvchi moment maksimal qiymatga erishadi (M_max = I · S · B). α = 0° bo‘lganda ramka turg‘un muvozanat holatida bo‘ladi.", "Elektr dvigatel, kir yuvish mashinasi va ventilyatorda tokli ramka magnit maydonda aylanadi.", "lor", {}], ["Tokli ramkaning muvozanat holatlari hamda elektrodvigatel va galvanometrlarning ishlash prinsipi.", "Bu fizik hodisa elektr dvigatellari, galvanometrlar va ampermertlarning buruvchi mexanizmiga asos qilib olingan.", "Kineskop, siklotron va mass-spektrometrda zaryadli zarralar magnit maydon yordamida boshqariladi.", "lor", {}]],["Faradeyning elektromagnit induksiya qonuniga ko‘ra induksiya EYUK nimaga bog‘liq?", ["Magnit oqimi qiymatiga", "Magnit oqimining o‘zgarish tezligiga", "Zanjir qarshiligiga", "Haroratga"], 1]);
L(3,"I bob. Magnit maydon","Tokli to‘g‘ri o‘tkazgichning, halqa va g‘altakning magnit maydoni",[["To‘g‘ri o‘tkazgichdagi tokning magnit maydoni va Bio-Savar-Laplas qonunining tatbiqi.", "Bio-Savar-Laplas qonuni ixtiyoriy shakldagi tokli o‘tkazgich hosil qilgan magnit maydonini hisoblash imkonini beradi. A) Cheksiz uzun to‘g‘ri o‘tkazgichdan r masofadagi magnit induksiyasi: B = (μ0 · μ · I) / (2π · r).", "Kompas strelkasi va telefondagi kompas Yerning magnit maydonini sezadi.", "lor", {}], ["Tokli doiraviy halqa markazidagi magnit induksiya vektorini hisoblash (B = μ0 * I / (2R)).", "B) R radiusli doiraviy tokli halqaning markazida: B = (μ0 · μ · I) / (2R). C) N ta o‘ramli, L uzunlikdagi solenoid (g‘altak) ichidagi magnit maydoni amalda bir jinsli bo‘lib, B = μ0 · μ · n · I tenglama bilan topiladi, bu yerda n = N / L — birlik uzunlikdagi o‘ramlar soni.", "Elektr dvigatel, kir yuvish mashinasi va ventilyatorda tokli ramka magnit maydonda aylanadi.", "lor", {}], ["Solenoid (g‘altak) ichidagi bir jinsli magnit maydon va uni kuchaytirish usullari.", "Magnit o‘zak kiritilganda μ kirituvchanlik hisobiga maydon keskin kuchayadi.", "Kineskop, siklotron va mass-spektrometrda zaryadli zarralar magnit maydon yordamida boshqariladi.", "lor", {}]],["G‘altakning induktivligi 0.2 H bo‘lib, undan 4 A tok oqsa, undagi magnit maydon energiyasini hisoblang.", ["1.6 J", "0.8 J", "3.2 J", "0.4 J"], 1]);
L(4,"I bob. Magnit maydon","Tokli o‘tkazgichni magnit maydonda ko‘chirishda bajarilgan ish",[["Magnit oqimi tushunchasi (Φ = B * S * cos α) va uning birligi (Veber - Wb).", "S yuzadan o‘tayotgan magnit induksiya chiziqlari sonini tavsiflovchi skalar kattalik magnit oqimi (Φ) deyiladi: Φ = B · S · cos(α). SI sistemasida magnit oqim birligi Veber (1 Wb = 1 T · m²).", "Kompas strelkasi va telefondagi kompas Yerning magnit maydonini sezadi.", "lor", {}], ["Amper kuchi ta’sirida tokli o‘tkazgichning siljishida bajarilgan ish (A = I * ΔΦ).", "Tokli o‘tkazgich magnit maydonida Amper kuchi ta’sirida dx masofaga ko‘chganda bajarilgan ish A = F · dx = I · B · L · dx = I · dS · B = I · dΦ ko‘rinishida ifodalanadi. To‘liq bajarilgan ish kontur kesib o‘tgan magnit oqimi o‘zgarishiga proporsional: A = I · ΔΦ.", "Elektr dvigatel, kir yuvish mashinasi va ventilyatorda tokli ramka magnit maydonda aylanadi.", "lor", {}], ["Yopiq konturning magnit maydonidagi energetik holati.", "Bu tenglama elektr dvigatellarining mexanik ish bajarish hisob-kitoblarida asosiy tenglama hisoblanadi.", "Kineskop, siklotron va mass-spektrometrda zaryadli zarralar magnit maydon yordamida boshqariladi.", "lor", {}]],["Zaryadli zarracha bir jinsli magnit maydoniga tezlik vektoriga tik kirsa, uning trayektoriyasi qanday shaklda bo‘ladi?", ["To‘g‘ri chiziq", "Parabola", "Aylana", "Giperbola"], 2]);
L(5,"I bob. Magnit maydon","Tokli o‘tkazgichlarning o‘zaro ta’sir kuchi",[["Parallel toklarning o‘zaro tortishish va itarish hodisasi (Ampere tajribalari).", "Bir-biridan d masofada joylashgan ikkita parallel to‘g‘ri o‘tkazgichdan bir xil yo‘nalishda tok oqsa, ular bir-birini tortadi, qarama-qarshi yo‘nalishda oqsa, itaradi.", "Kompas strelkasi va telefondagi kompas Yerning magnit maydonini sezadi.", "lor", {}], ["O‘tkazgichlarning birlik uzunligiga ta’sir etuvchi kuch formulasi (F / l = μ0 * I1 * I2 / (2π * d)).", "L uzunlikdagi qismiga ta’sir etuvchi kuch: F = (μ0 · I1 · I2 · L) / (2π · d).", "Elektr dvigatel, kir yuvish mashinasi va ventilyatorda tokli ramka magnit maydonda aylanadi.", "lor", {}], ["SI xalqaro birliklar sistemasida 1 Amper (1 A) birligining qat’iy fizik ta’rifi.", "SI sistemasida 1 Amper tok kuchi birligi ushbu ta’sir kuchi orqali aniqlanadi: 1 Amper — bu vakuumda bir-biridan 1 metr masofada joylashgan cheksiz uzun va o‘ta kichik ko‘ndalang kesimli ikkita parallel o‘tkazgichdan o‘tganda, ularning har bir metr uzunligida 2 · 10^-7 Nyuton o‘zaro ta’sir kuchi hosil qiladigan o‘zgarmas tok kuchidir.", "Kineskop, siklotron va mass-spektrometrda zaryadli zarralar magnit maydon yordamida boshqariladi.", "lor", {}]],["Magnit induksiya vektori B ning SI dagi birligi nima?", ["Veber (Wb)", "Tesla (T)", "Genri (H)", "Farad (F)"], 1]);
L(6,"I bob. Magnit maydon","Bir jinsli magnit maydonida zaryadli zarraning harakati. Lorens kuchi",[["Lorens kuchi (F_L = q * v * B * sin α) va uning yo‘nalishini chap qo‘l qoidasi bilan aniqlash.", "Magnit maydonida harakatlanayotgan q zaryadli zarraga ta’sir qiluvchi kuch Lorens kuchi deyiladi: F_L = |q| · v · B · sin(α). Lorens kuchi har doim zarracha tezligi v va B vektoriga tik yo‘nalgani uchun ish bajarmaydi (A = 0) va faqat markazga intilma tezlanish beradi.", "Kompas strelkasi va telefondagi kompas Yerning magnit maydonini sezadi.", "lor", {}], ["Zarrachaning bir jinsli magnit maydondagi trayektoriyasi (aylana va spiral).", "Zarracha B ga tik kirganda (α = 90°) R = (m · v) / (q · B) radiusli aylana bo‘ylab harakatlanadi. Aylanish davri T = (2π · m) / (q · B) bo‘lib, u zarracha tezligi va orbitasi radiusiga bog‘liq emas.", "Elektr dvigatel, kir yuvish mashinasi va ventilyatorda tokli ramka magnit maydonda aylanadi.", "lor", {}], ["Siklotron, mass-spektrometr va televizion kineskoplarning ishlash prinsipi.", "Agar zarracha B vektori bilan α burchak ostida kirsa, u vintsimon (spiral) trayektoriya bo‘ylab harakatlanadi.", "Kineskop, siklotron va mass-spektrometrda zaryadli zarralar magnit maydon yordamida boshqariladi.", "lor", {}]],["Induksiyasi 0.4 T bir jinsli magnit maydoniga 5 A tokli 0.5 m o‘tkazgich tik joylashtirilgan. Unga ta’sir etuvchi Amper kuchini toping.", ["1.0 N", "2.0 N", "0.1 N", "0.5 N"], 0]);
L(7,"II bob. Elektromagnit induksiya","Elektromagnit induksiya hodisasi. Induksiya EYUK. Faradey qonuni",[["Faradey tajribalari va elektromagnit induksiya hodisasining mahiyati.", "1831-yilda M.Faradey yopiq o‘tkazgich konturi bilan chegaralangan yuzadan o‘tayotgan magnit oqimi o‘zgarganda konturda elektr toki paydo bo‘lishini kashf etdi. Induksiya EYUK (E_i) magnit oqimining o‘zgarish tezligiga teng: E_i = - dΦ / dt.", "Simsiz zaryadlash qurilmasi va induksion plita elektromagnit induksiya asosida ishlaydi.", "ind", {}], ["Faradeyning elektromagnit induksiya qonuni (E_i = - ΔΦ / Δt).", "Ko‘p o‘ramli N ta chulg‘amli g‘altak uchun E_i = - N · (dΦ / dt).", "Zanjir uzilganda chiqadigan uchqun o‘zinduksiya EYUK ning natijasidir.", "ind", {}], ["Lens qoidasi va energiyaning saqlanish qonuni bilan bog‘liqligi.", "Minus ishorasi Lens qoidasini ifodalaydi: Induksion tok har doim shunday yo‘nalgan magnit maydonini hosil qiladiki, bu maydon o‘zini tug‘dirayotgan magnit oqimining o‘zgarishiga qarshilik ko‘rsatadi.", "Generator va transformator o‘zgaruvchan magnit oqimidan elektr energiya oladi.", "ind", {}]],["Faradeyning elektromagnit induksiya qonuniga ko‘ra induksiya EYUK nimaga bog‘liq?", ["Magnit oqimi qiymatiga", "Magnit oqimining o‘zgarish tezligiga", "Zanjir qarshiligiga", "Haroratga"], 1]);
L(8,"II bob. Elektromagnit induksiya","O‘zinduksiya hodisasi. O‘zinduksiya EYUK. Induktivlik",[["Konturdan o‘tayotgan tok o‘zgarganda o‘zinduksiya hodisasining namoyon bo‘lishi.", "Konturdan tok o‘tganda u o‘z atrofida magnit oqimi hosil qiladi: Φ = L · I. Bu yerda L — konturning induktivligi (o‘zinduksiya koeffitsiyenti).", "Simsiz zaryadlash qurilmasi va induksion plita elektromagnit induksiya asosida ishlaydi.", "ind", {}], ["Konturning induktivligi (L) va uning SI dagi birligi Genri (H).", "SI sistemasida L ning birligi Genri (1 H = 1 Wb / A = 1 V · s / A). Zanjirdagi tok kuchi o‘zgarganda konturning o‘zida o‘zinduksiya EYUK paydo bo‘ladi: E_s = - L · (dI / dt).", "Zanjir uzilganda chiqadigan uchqun o‘zinduksiya EYUK ning natijasidir.", "ind", {}], ["O‘zinduksiya EYUK (E_s = - L * dI / dt) hamda zanjirni uzish va ulashdagi extra-toklar.", "Induktivlik elektrodinamikada xuddi mexanikadagi inersiya massasiga o‘xshash rol o‘ynaydi — u zanjirdagi tokning birdaiga ortib yoki kamayib ketishiga to‘sqinlik qiladi.", "Generator va transformator o‘zgaruvchan magnit oqimidan elektr energiya oladi.", "ind", {}]],["G‘altakning induktivligi 0.2 H bo‘lib, undan 4 A tok oqsa, undagi magnit maydon energiyasini hisoblang.", ["1.6 J", "0.8 J", "3.2 J", "0.4 J"], 1]);
L(9,"II bob. Elektromagnit induksiya","Moddalarning magnit xossalari",[["Magnetiklar va nisbiy magnit kirituvchanlik (μ).", "Tashqi magnit maydoniga kiritilgan har qanday modda magnitlanadi. Moddaning magnit xossalari nisbiy magnit kirituvchanlik μ = B / B0 parametri bilan baholanadi.", "Simsiz zaryadlash qurilmasi va induksion plita elektromagnit induksiya asosida ishlaydi.", "ind", {}], ["Diamagnetiklar (μ < 1) va paramagnetiklar (μ > 1) atomik tabiati.", "Moddalar 3 guruhga bo‘linadi: 1) Diamagnetiklar (μ < 1, masalan, mis, suv, vismut). 2) Paramagnetiklar (μ > 1, masalan, alyuminiy, kislorod).", "Zanjir uzilganda chiqadigan uchqun o‘zinduksiya EYUK ning natijasidir.", "ind", {}], ["Ferromagnetiklar, gisterezis halqasi va Kyuri harorati.", "3) Ferromagnetiklar (μ >> 1, masalan, temir, nikel, kobalt). Ferromagnetiklar uchun B(H) bog‘liqlik nochiziqli bo‘lib, gisterezis halqasini hosil qiladi.", "Generator va transformator o‘zgaruvchan magnit oqimidan elektr energiya oladi.", "ind", {}]],["Zaryadli zarracha bir jinsli magnit maydoniga tezlik vektoriga tik kirsa, uning trayektoriyasi qanday shaklda bo‘ladi?", ["To‘g‘ri chiziq", "Parabola", "Aylana", "Giperbola"], 2]);
L(10,"II bob. Elektromagnit induksiya","Magnit maydon energiyasi",[["Tokli g‘altakda jamlangan magnit maydon energiyasi (W_m = L * I² / 2).", "Zanjir ulangan vaqtda manba manfiy o‘zinduksiya EYUK ga qarshi ish bajaradi. Bu ish g‘altak ichida magnit maydon energiyasi ko‘rinishida toplanadi: W_m = (L · I²) / 2.", "Simsiz zaryadlash qurilmasi va induksion plita elektromagnit induksiya asosida ishlaydi.", "ind", {}], ["Magnit maydon energiyasining hajmiy zichligi (w_m = B² / (2 * μ0 * μ)).", "Bir jinsli magnit maydoni uchun ushbu energiyani hajmiy zichlik orqali ifodalash mumkin: w_m = W_m / V = (B²) / (2 · μ0 · μ).", "Zanjir uzilganda chiqadigan uchqun o‘zinduksiya EYUK ning natijasidir.", "ind", {}], ["Elektr va magnit maydon energiyalarining qiyosiy xarakteristikasi.", "Bu tenglama ko‘rsatadiki, magnit energiyasi tokning o‘zida emas, balki tok hosil qilgan magnit maydonining fazoviy hajmida jamlanadi.", "Generator va transformator o‘zgaruvchan magnit oqimidan elektr energiya oladi.", "ind", {}]],["Magnit induksiya vektori B ning SI dagi birligi nima?", ["Veber (Wb)", "Tesla (T)", "Genri (H)", "Farad (F)"], 1]);
L(11,"III bob. Elektromagnit tebranishlar","Erkin elektromagnit tebranishlar (tebranish konturi)",[["Tebranish konturining tuzilishi (C sig‘imli kondensator va L induktivlikli g‘altak).", "Tebranish konturi — ketma-ket ulangan C sig‘imli kondensator va L induktivli g‘altakdan iborat ideal zanjir. Zaryadlangan kondensator plastinkalari tutashtirilganda, elektr maydon energiyasi W_e = q² / (2C) g‘altakdagi magnit maydon energiyasiga W_m = L I² / 2 aylanadi.", "Radiopriyomnikni stansiyaga sozlash tebranish konturining chastotasini o‘zgartirish orqali bajariladi.", "lc", {}], ["Konturda elektr va magnit maydon energiyalarining o‘zaro davriy aylanishi.", "Yo‘qotishlarsiz ideal konturda to‘liq energiya saqlanadi: W = q² / (2C) + L I² / 2 = const.", "Urilgan qo‘ng‘iroqning tovushi asta-sekin pasayadi — bu so‘nuvchi tebranishlarga o‘xshaydi.", "lc", {}], ["Tomson formulasi (T = 2π √(L C)) va xususiy tebranish chastotasi (ω0 = 1 / √(L C)).", "Erkin tebranishlar davri Tomson formulasi bilan topiladi: T = 2π · √(L · C).", "Telefon va Wi-Fi qurilmalaridagi generatorlar so‘nmas tebranishlar hosil qiladi.", "lc", {}]],["Kondensatorli o‘zgaruvchan tok zanjirida tok kuchi va kuchlanish o‘rtasidagi fazaviy siljish qanday?", ["Faza mos keladi", "Kuchlanish tokdan 90° ilgarilaydi", "Tok kuchlanishdan 90° ilgarilaydi", "Faza qarama-qarshi (180°)"], 2]);
L(12,"III bob. Elektromagnit tebranishlar","Tebranishlarni grafik ravishda tasvirlash. So‘nuvchi tebranishlar",[["Zaryad, tok kuchi va kuchlanish tebranishlarining garmonik grafiklari.", "Real tebranish konturida har doim aktiv qarshilik R bo‘ladi.", "Radiopriyomnikni stansiyaga sozlash tebranish konturining chastotasini o‘zgartirish orqali bajariladi.", "lc", {}], ["Aktiv qarshilik R tufayli energiyaning Djoul issiqligiga aylanishi va so‘nish faktori.", "U tufayli elektromagnit energiya sekin-asta issiqlikka aylanib yo‘qoladi.", "Urilgan qo‘ng‘iroqning tovushi asta-sekin pasayadi — bu so‘nuvchi tebranishlarga o‘xshaydi.", "lc", {}], ["So‘nish koeffitsiyenti (β = R / 2L) va konturning sifat ko‘rsatkichi (Q-factor).", "Natijada tebranishlar so‘nuvchi bo‘ladi: q(t) = q0 · e^(-β t) · cos(ω t + φ), bu yerda β = R / (2L) — so‘nish koeffitsiyenti.", "Telefon va Wi-Fi qurilmalaridagi generatorlar so‘nmas tebranishlar hosil qiladi.", "lc", {}]],["RLC zanjirida kuchlanishlar rezonansi sodir bo‘lish sharti qaysi?", ["X_L = X_C", "R = 0", "X_L = 0", "ω = 0"], 0]);
L(13,"III bob. Elektromagnit tebranishlar","Tranzistorli elektromagnit tebranishlar generatori",[["So‘nmas tebranishlarni hosil qilish va avtotebranish tizimlari prinsipi.", "So‘nmas tebranishlar olish uchun konturga aktiv qarshilikdagi energiya yo‘qotilishini qoplaydigan tashqi manbadan vaqtida energiya uzatib turish kerak.", "Radiopriyomnikni stansiyaga sozlash tebranish konturining chastotasini o‘zgartirish orqali bajariladi.", "lc", {}], ["Tranzistorli avtogeneratorda musbat teskari aloqa (induktiv/sig‘imiy aloqa).", "Avtotebranish generatori 3 ta asosiy qismdan iborat: 1) Tebranish konturi, 2) O‘zgarmas tok manbai, 3) Klapan rolini o‘ynovchi tranzistor va musbat teskari aloqa g‘altagi.", "Urilgan qo‘ng‘iroqning tovushi asta-sekin pasayadi — bu so‘nuvchi tebranishlarga o‘xshaydi.", "lc", {}], ["Radiotexnika va uzatgichlarda avtogeneratorlarning o‘rni.", "Ushbu band yuqoridagi nazariy ma’lumotga tayanadi: radiotexnika va uzatgichlarda avtogeneratorlarning o‘rni.", "Telefon va Wi-Fi qurilmalaridagi generatorlar so‘nmas tebranishlar hosil qiladi.", "lc", {}]],["O‘zgaruvchan tokning effektiv (ta’sir etuvchi) qiymati I_eff va ampiltuda I_m o‘rtasidagi bog‘liqlik?", ["I_eff = I_m / 2", "I_eff = I_m / √2", "I_eff = I_m · √2", "I_eff = 2 I_m"], 1]);
L(14,"III bob. Elektromagnit tebranishlar","O‘zgaruvchan tok zanjiridagi aktiv qarshilik",[["O‘zgaruvchan tok va kuchlanishning garmonik tebranish tenglamalari.", "O‘zgaruvchan tok — kattaligi va yo‘nalishi vaqt bo‘yicha davriy o‘zgaradigan tokdir. R aktiv qarshilik ulangan zanjirda kuchlanish u(t) = U_m · sin(ω t) bo‘lganda tok kuchi i(t) = I_m · sin(ω t) bo‘ladi.", "Uydagi rozetkada effektiv kuchlanishi 220 V bo‘lgan o‘zgaruvchan tok bor.", "ac", {}], ["Aktiv qarshilikda tok va kuchlanishning faza mosligi (Δφ = 0).", "Tok kuchi va kuchlanish tebranishlari bir xil fazada tebranadi (Δφ = 0).", "Radio va televizor kerakli stansiyani rezonans yordamida tanlaydi.", "ac", {}], ["O‘zgaruvchan tokning effektiv qiymatlari (I_eff = I_m / √2, U_eff = U_m / √2).", "O‘zgaruvchan tokning ta’sir etuvchi (effektiv) qiymatlari: I_eff = I_m / √2, U_eff = U_m / √2.", "Zavodlarda cos φ ni oshirish elektr energiyasining isrofini kamaytiradi.", "ac", {}]],["Rezonans vaqtida RLC zanjirining to‘liq qarshiligi (impedans Z) nimaga teng bo‘ladi?", ["Z = R", "Z = X_L + X_C", "Z = 0", "Z = ∞"], 0]);
L(15,"III bob. Elektromagnit tebranishlar","O‘zgaruvchan tok zanjiridagi kondensator",[["Kondensatorda zaryadlanish va zaryadsizlanish toklari.", "O‘zgaruvchan tok zanjiriga ulangan C sig‘imli kondensator davriy zaryadlanib-zaryadsizlanib tok oqishini ta’minlaydi.", "Uydagi rozetkada effektiv kuchlanishi 220 V bo‘lgan o‘zgaruvchan tok bor.", "ac", {}], ["Sig‘im qarshiligi formulasi (X_C = 1 / (ω C)) va chastotaga bog‘liqligi.", "Tok kuchi kuchlanishdan fazasi bo‘yicha π/2 (90°) ga ilgarilab ketadi.", "Radio va televizor kerakli stansiyani rezonans yordamida tanlaydi.", "ac", {}], ["Tok va kuchlanish o‘rtasidagi fazaviy siljish (tok kuchi kuchlanishdan π/2 ga oldinda).", "Sig‘im qarshiligi: X_C = 1 / (ω C) = 1 / (2π · f · C).", "Zavodlarda cos φ ni oshirish elektr energiyasining isrofini kamaytiradi.", "ac", {}]],["Tomson formulasi T = 2π√(LC) nimani aniqlaydi?", ["Matematik mayatnik davrini", "Tebranish konturining erkin tebranishlar davrini", "To‘lqin tezligini", "Kondensator quvvatini"], 1]);
L(16,"III bob. Elektromagnit tebranishlar","O‘zgaruvchan tok zanjiridagi induktiv g‘altak",[["O‘zinduksiya EYUK ning o‘zgaruvchan tokka ko‘rsatgan qarshiligi.", "Induktivlikli g‘altakdan o‘zgaruvchan tok o‘tganda kuchlanish tebranishi tok kuchi tebranishidan fazasi bo‘yicha π/2 (90°) ga ilgarilab ketadi.", "Uydagi rozetkada effektiv kuchlanishi 220 V bo‘lgan o‘zgaruvchan tok bor.", "ac", {}], ["Induktiv qarshilik formulasi (X_L = ω L) va uning chastotaga to‘g‘ri proporsionalligi.", "Induktiv qarshilik formulasi: X_L = ω · L = 2π · f · L.", "Radio va televizor kerakli stansiyani rezonans yordamida tanlaydi.", "ac", {}], ["Tok kuchi va kuchlanish o‘rtasidagi fazalar farqi (kuchlanish tokdan π/2 ga oldinda).", "Ushbu band yuqoridagi nazariy ma’lumotga tayanadi: tok kuchi va kuchlanish o‘rtasidagi fazalar farqi (kuchlanish tokdan π/2 ga oldinda).", "Zavodlarda cos φ ni oshirish elektr energiyasining isrofini kamaytiradi.", "ac", {}]],["Kondensatorli o‘zgaruvchan tok zanjirida tok kuchi va kuchlanish o‘rtasidagi fazaviy siljish qanday?", ["Faza mos keladi", "Kuchlanish tokdan 90° ilgarilaydi", "Tok kuchlanishdan 90° ilgarilaydi", "Faza qarama-qarshi (180°)"], 2]);
